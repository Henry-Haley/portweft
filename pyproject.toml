[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portweft"
version = "1.1.1"
description = "Lightweight opening-recon orchestration for authorized assessments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
impacket = ["impacket>=0.11"]

[project.scripts]
portweft = "portweft.cli:main"

[tool.setuptools]
packages = ["portweft"]
